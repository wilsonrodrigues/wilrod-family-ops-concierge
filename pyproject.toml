[project]
name = "family-ops-concierge"
version = "0.9.0"
description = "Multimodal Multi-Agent Family Calendar, Errands & Wish-List Concierge built with Google ADK"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:\\[EXPERIMENTAL\\] feature FUNCTION_TOOL_ARG_VALIDATION is enabled:UserWarning",
]
